name: Vib Build

on:
  push:
    branches:
      - 'dev'
      - 'vision'
    tags:
      - '*'
  workflow_dispatch:
  pull_request:
  schedule: 
    - cron: '21 */6 * * *'

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  check_update:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.set_output.outputs.has_updates }}
      base_image: ${{ steps.read_base_recipe.outputs.base_image }}

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y jq skopeo libfyaml-utils

      - name: Read base image name from recipe
        id: read_base_recipe
        run: |
          BASE_IMAGE="$(fy-filter -f recipe.yml /stages/-1/base)"
          echo "The base image is $BASE_IMAGE"
          if [ -z $BASE_IMAGE ]; then exit 1; fi
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Get last successful run ID
        if: ${{ github.ref_type == 'branch' }}
        continue-on-error: true
        run: |
          gh run list -b "${{ github.ref_name }}" -w "${{ github.workflow }}" -s "success" -L 1 --json databaseId > last_run.json
          echo "LAST_RUN_ID=$(jq -r '.[0].databaseId' last_run.json)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download previous digest
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: digest
          github-token: ${{ github.token }}
          run-id: ${{ env.LAST_RUN_ID }}

      - name: Compare base image digest
        run: |
          touch digest.txt
          mv digest.txt last_digest.txt
          skopeo inspect --raw docker://${{ env.BASE_IMAGE }} | sha256sum > digest.txt
          echo "Old digest: $(cat last_digest.txt)"
          echo "New digest: $(cat digest.txt)"
          echo "HAS_UPDATES=$(cmp -s digest.txt last_digest.txt; echo $?)" >> "$GITHUB_ENV"

      - name: Upload current digest for next run
        uses: actions/upload-artifact@v7
        with:
          name: digest
          path: digest.txt

      - name: Set output flag
        id: set_output
        run: |
          if [ ${{ github.event_name == 'schedule' }} == false ]; then
            echo "action was manually/source triggered, updating either way"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          elif [ ${{ env.HAS_UPDATES }} == 1 ]; then
            echo "base image was updated since the last build"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "no updates to the base image since the last build"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

  verify-image:
    runs-on: ubuntu-latest
    needs: check_update
    steps:
    - name: Verify Base Image Integrity
      if: ${{ github.ref_type == 'tag' && needs.check_update.outputs.has_updates == 'true' }}
      run:
        gh attestation verify oci://ghcr.io/vanilla-os/gnome:latest --owner Vanilla-OS
      env:
        GH_TOKEN: ${{ github.token }}

  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image_name:
          - gnome-china
          - gnome-nvidia-china
          - gnome-nvidia-modern-china
          - gnome-vm-china
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - base_image: ghcr.io/vanilla-os/gnome
            image_name: gnome-china
          - base_image: ghcr.io/vanilla-os/gnome-nvidia
            image_name: gnome-nvidia-china
          - base_image: ghcr.io/vanilla-os/gnome-nvidia-modern
            image_name: gnome-nvidia-modern-china
          - base_image: ghcr.io/vanilla-os/gnome-vm
            image_name: gnome-vm-china
    runs-on: ${{ matrix.runner }}
    needs: [verify-image,check_update]
    permissions:
      packages: write # Allow pushing images to GHCR
      attestations: write # To create and write attestations
      id-token: write # Additional permissions for the persistence of the attestations

    steps:
    - uses: actions/checkout@v7

    - name: Change tag and image in recipe and ABRoot
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="latest"
        elif [ -n "${{ github.base_ref }}" ]; then
          TAG="${{ github.base_ref }}"
        else
          TAG="${{ github.ref_name }}"
        fi
        sed -i "s|^  base:.*|  base: ${{ matrix.base_image }}:$TAG|" recipe.yml
        sed -i 's|"name": ".*"|"name": "vanilla-flavors/${{ matrix.image_name }}"|' includes.container/usr/share/abroot/abroot.json

    - uses: vanilla-os/vib-gh-action@v1.1.0
      with:
        recipe: 'recipe.yml'

    - uses: actions/upload-artifact@v7
      with:
        name: Containerfile
        path: Containerfile
        overwrite: true

    - name: Generate image name
      run: |
        REPO_OWNER_LOWERCASE="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
        echo "REPO_OWNER_LOWERCASE=$REPO_OWNER_LOWERCASE" >> "$GITHUB_ENV"
        echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/${{ matrix.image_name }}" >> "$GITHUB_ENV"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_URL }}
        labels: org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Package Registry
      uses: docker/login-action@v4
      if: ${{ github.event_name != 'pull_request' }}
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Git commit timestamps
      run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Containerfile
        tags: ${{ env.IMAGE_URL }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/${{ matrix.arch }}
        provenance: false
        outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true
      env:
        SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

    - name: Attest pushed image
      uses: actions/attest-build-provenance@v4
      id: attest
      if: ${{ github.event_name != 'pull_request' }}
      with:
        subject-name: ${{ env.IMAGE_URL }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: false

    - name: Export digest
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      if: ${{ github.event_name != 'pull_request' }}
      with:
        name: digests-${{ matrix.image_name }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - gnome-china
          - gnome-nvidia-china
          - gnome-nvidia-modern-china
          - gnome-vm-china
    permissions:
      contents: write # Allow actions to create release
      packages: write # Allow pushing images to GHCR

    steps:
    - name: Generate image name
      run: |
        REPO_OWNER_LOWERCASE="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
        echo "REPO_OWNER_LOWERCASE=$REPO_OWNER_LOWERCASE" >> "$GITHUB_ENV"
        echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/${{ matrix.image_name }}" >> "$GITHUB_ENV"

    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-${{ matrix.image_name }}-*
        merge-multiple: true

    - name: Extra image tag branch
      if: ${{ github.ref_type != 'tag' }}
      run: |
        echo "EXTRA_TAG=ref,event=branch" >> "$GITHUB_ENV"

    - name: Extra image tag release
      if: ${{ github.ref_type == 'tag' }}
      run: |
        echo "EXTRA_TAG=raw,latest" >> "$GITHUB_ENV"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_URL }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{raw}}
          type=semver,pattern=v{{major}}
          type=${{ env.EXTRA_TAG }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Package Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.IMAGE_URL }}@sha256:%s ' *)
